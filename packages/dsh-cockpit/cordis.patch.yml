# Mounts the dsh-cockpit host plugin. A profile patch with the same id
# replaces the whole config, so restate the fields you keep.
- insert:
    - id: dsh-cockpit
      name: '@rs-dsh/dsh-cockpit'
      config:
        # false: register no tools.
        tools:
          enabled: true
        # false: no routes, so no panel data.
        route:
          enabled: true
        # An optional command that reports the real state of linked work; empty: no check.
        # It runs only on board_read({ checkDrift: true }), in cwd. See examples/board-drift-gh.sh.
        # mode: report (changes no task) or apply (sets each differing task's status).
        drift:
          command: ''
          cwd: ''
          mode: report
        # URL patterns for issue and pr references that are not full URLs, with
        # {ref}, {repo} and {number}; empty: only full http(s) URLs link.
        # For example: issue: 'https://github.com/{repo}/issues/{number}'
        links:
          issue: ''
          pr: ''
        # false: agents are not asked to plan multi-step work on a board; the
        # rules for keeping a bound board current stay.
        planning:
          enabled: true
        # The skill /cockpit-refine hands the domain analysis of Inbox items to
        # when the user names none, such as grill-me; empty: its own checklist.
        inbox:
          refineSkill: ''
        # true: hides the todo_write tool for the agent while a board is bound.
        # Subagents keep their own todo lists.
        replaces:
          todo: true
