name: publish

# Publishes @rs-dsh/dsh-cockpit when a tag dsh-cockpit@<version> is pushed.
on:
  push:
    tags:
      - 'dsh-cockpit@*'

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # main's history, for the check that the tag is on main.
          fetch-depth: 0
      # The pnpm version comes from packageManager in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present test
      - name: Check the tag's version against package.json
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./packages/dsh-cockpit/package.json').version")"
          if [ "$TAG" != "dsh-cockpit@$version" ]; then
            echo "::error::tag $TAG does not match package.json version $version"
            exit 1
          fi
          # A prerelease (a version with "-", such as 0.2.0-rc.1) goes to npm's next tag; a plain version is latest.
          case "$version" in
            *-*) echo "dist-tag=next" >> "$GITHUB_OUTPUT" ;;
            *) echo "dist-tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Check that the tagged commit is on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $TAG is not on main: its commit $GITHUB_SHA is not an ancestor of origin/main"
            exit 1
          fi
      - run: pnpm publish --filter @rs-dsh/dsh-cockpit --no-git-checks --tag "$DIST_TAG"
        env:
          DIST_TAG: ${{ steps.version.outputs.dist-tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
