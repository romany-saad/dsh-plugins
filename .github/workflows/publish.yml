name: publish

# Publishes @rs-dsh/dsh-cockpit when a tag dsh-cockpit@<version> is pushed.
on:
  push:
    tags:
      - 'dsh-cockpit@*'

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pnpm version comes from packageManager in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present test
      - name: Check the tag's version against package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./packages/dsh-cockpit/package.json').version")"
          if [ "$TAG" != "dsh-cockpit@$version" ]; then
            echo "::error::tag $TAG does not match package.json version $version"
            exit 1
          fi
      - run: pnpm publish --filter @rs-dsh/dsh-cockpit --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
